<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MGT Filtre - Depo Sipariş Formu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: pan-y;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 25px;
            max-height: 95vh;
            overflow: visible;
            position: relative;
        }

        .header {
            display: none;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .header-content h1 {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-content p {
            color: #90caf9;
            font-size: 13px;
            font-weight: 400;
        }

        .form-content {
            padding: 30px;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
        }

        .product-list {
            margin-bottom: 0;
            position: relative;
        }

        .product-wrapper {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .product-wrapper:hover {
            border-color: #667eea;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .product-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .product-item-title {
            font-weight: 700;
            color: #667eea;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0;
        }

        .product-item {
            position: relative;
        }

        .product-item-title::before {
            content: '📦';
            font-size: 16px;
        }

        .product-item {
            position: relative;
        }

        .remove-btn {
            background: transparent;
            color: #dc3545;
            border: none;
            padding: 4px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            width: 28px;
            height: 28px;
        }

        .remove-btn:hover {
            background: rgba(220, 53, 69, 0.1);
            transform: scale(1.15);
        }

        .product-item-fields {
            display: grid;
            grid-template-columns: 2.5fr 0.95fr auto;
            gap: 8px;
            align-items: center;
        }

        .product-number {
            display: none;
        }

        .search-dropdown {
            position: static;
            grid-column: 1 / -1;
        }

        input, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
            background: white;
            color: #333;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .dropdown-list {
            position: fixed;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%);
            border: 3px solid #667eea;
            border-top: none;
            border-radius: 0 0 12px 12px;
            max-height: 60vh;
            overflow-y: auto;
            display: none;
            z-index: 999999;
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.25);
            padding-bottom: 8px;
        }
        
        /* Dropdown scroll bar */
        .dropdown-list::-webkit-scrollbar {
            width: 6px;
        }

        .dropdown-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .dropdown-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .dropdown-list::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        .dropdown-list.show {
            display: block;
        }

        .dropdown-item {
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(102, 126, 234, 0.15);
            font-size: 14px;
            word-wrap: break-word;
            white-space: normal;
            line-height: 1.5;
            background: white;
            margin: 4px 8px;
            border-radius: 8px;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #e0e7ff;
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }

        .no-results {
            padding: 15px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .stok-info {
            background: #fee2e2;
            border: 2px solid #ef4444;
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 8px;
            display: none;
            font-size: 13px;
        }

        .stok-info.show {
            display: block;
        }

        .stok-info p {
            margin: 0;
            font-weight: 600;
            color: #991b1b;
        }

        .add-product-btn {
            display: inline-block;
            padding: 8px 16px;
            background: #22C55E;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
            float: right;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
        }
        
        .add-product-btn:hover {
            background: #16A34A;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        
        .product-list-container {
            clear: both;
            margin-bottom: 15px;
            padding-right: 5px;
            position: relative;
        }
        
        .product-list {
            margin-bottom: 0;
            position: relative;
            max-height: calc(95vh - 350px);
            overflow-y: auto;
            overflow-x: visible;
        }

        /* Özel scroll bar */
        .product-list::-webkit-scrollbar {
            width: 6px;
        }

        .product-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .product-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .product-list::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        .form-group {
            margin-bottom: 0;
            position: relative;
            z-index: 1;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }
        
        .form-group:not(:last-of-type) {
            margin-bottom: 0;
            border-radius: 8px 8px 0 0;
        }
        
        .form-group:last-of-type {
            border-radius: 0 0 8px 8px;
        }
        
        form > .form-group:first-of-type {
            border-radius: 8px 8px 0 0;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: 13px;
        }

        textarea {
            resize: vertical;
            min-height: 50px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            z-index: 1;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .required {
            color: #ef4444;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            color: #666;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }

        .footer strong {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .product-wrapper {
                padding: 10px 12px;
                padding-left: 12px;
            }

            .product-number {
                display: none;
            }

            .product-item-title {
                font-size: 14px;
            }

            input, textarea {
                padding: 10px 12px;
                font-size: 14px;
            }

            .btn {
                padding: 12px;
                font-size: 15px;
            }

            .add-product-btn {
                padding: 8px 16px;
                font-size: 13px;
            }

            .product-item-fields {
                gap: 8px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                font-size: 13px;
                margin-bottom: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 MGT Filtre</h1>
            <p>Depo Sipariş Formu</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="siparisForm">
            <button type="button" class="add-product-btn" id="addProductBtn">
                + Ürün Ekle
            </button>

            <div class="product-list-container">
                <div class="product-list" id="productList"></div>
            </div>

            <div class="form-group">
                <label for="bolum">Bölüm <span class="required">*</span></label>
                <input type="text" id="bolum" placeholder="Örn: Montaj Bölümü" required>
            </div>

            <div class="form-group">
                <label for="notlar">Notlar (Opsiyonel)</label>
                <textarea id="notlar" placeholder="Varsa ek notlarınızı yazın..."></textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                ✓ Siparişi Gönder
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Sipariş gönderiliyor...</p>
        </div>

        <div class="footer">
            <strong>MGT Filtre</strong> • Malzeme Talep Formu
        </div>
    </div>

    <script>
        // DİNAMİK API URL - localhost ise direkt bağlan, değilse domain kullan
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:8000'
            : 'https://api.depoistek.com.tr';

        const form = document.getElementById('siparisForm');
        const productList = document.getElementById('productList');
        const addProductBtn = document.getElementById('addProductBtn');
        const bolumInput = document.getElementById('bolum');
        const notlarInput = document.getElementById('notlar');
        const alert = document.getElementById('alert');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        let stokData = {};
        let productCounter = 0;

        async function loadStok() {
            try {
                const response = await fetch(`${API_URL}/stok`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                const data = await response.json();
                if (data.success) {
                    stokData = data.stok;
                    addProduct();
                }
            } catch (error) {
                showAlert('Stok listesi yüklenemedi. Lütfen sayfayı yenileyin.', 'error');
            }
        }

        function addProduct() {
            productCounter++;
            const productId = `product-${productCounter}`;
            
            const productWrapper = document.createElement('div');
            productWrapper.className = 'product-wrapper';
            productWrapper.id = `wrapper-${productId}`;
            productWrapper.innerHTML = `
                <div class="product-number">${productCounter}</div>
                <div class="product-item" id="${productId}">
                    <div class="product-item-fields">
                        <div>
                            <input 
                                type="text" 
                                class="urun-search" 
                                data-id="${productId}"
                                placeholder="🔍 Ürün adı yazın..."
                                autocomplete="off"
                                required
                            >
                            <input type="hidden" class="urun-hidden" data-id="${productId}">
                            <div class="stok-info" id="stok-${productId}"></div>
                        </div>
                        <div>
                            <input 
                                type="number" 
                                class="miktar-input" 
                                data-id="${productId}"
                                min="1" 
                                placeholder="Miktar"
                                required
                            >
                        </div>
                        ${productCounter > 1 ? `<button type="button" class="remove-btn" onclick="removeProduct('${productId}')">✕</button>` : '<div></div>'}
                    </div>
                </div>
            `;
            
            productList.appendChild(productWrapper);
            
            // Dropdown'ı body'ye ekle
            const dropdownList = document.createElement('div');
            dropdownList.className = 'dropdown-list';
            dropdownList.id = `dropdown-${productId}`;
            document.body.appendChild(dropdownList);
            
            setupProductEvents(productId);
            updateProductNumbers();
        }

        function removeProduct(productId) {
            document.getElementById(`wrapper-${productId}`)?.remove();
            document.getElementById(`dropdown-${productId}`)?.remove(); // Dropdown'ı da sil
            updateProductNumbers();
        }
        
        function updateProductNumbers() {
            const wrappers = document.querySelectorAll('.product-wrapper');
            wrappers.forEach((wrapper, index) => {
                const numberDiv = wrapper.querySelector('.product-number');
                if (numberDiv) {
                    numberDiv.textContent = `${index + 1}`;
                }
            });
        }

        function setupProductEvents(productId) {
            const searchInput = document.querySelector(`.urun-search[data-id="${productId}"]`);
            const hiddenInput = document.querySelector(`.urun-hidden[data-id="${productId}"]`);
            const dropdownList = document.getElementById(`dropdown-${productId}`);
            const miktarInput = document.querySelector(`.miktar-input[data-id="${productId}"]`);
            const stokInfo = document.getElementById(`stok-${productId}`);

            let filteredProducts = [];

            // Dropdown pozisyonunu ayarla
            function positionDropdown() {
                const rect = searchInput.getBoundingClientRect();
                dropdownList.style.top = `${rect.bottom - 2}px`;
                dropdownList.style.left = `${rect.left}px`;
                dropdownList.style.width = `${rect.width}px`;
            }

            searchInput.addEventListener('focus', function() {
                // Bu ürünün wrapper'ına en yüksek z-index ver
                const allWrappers = document.querySelectorAll('.product-wrapper');
                allWrappers.forEach(w => w.style.zIndex = '1');
                document.getElementById(`wrapper-${productId}`).style.zIndex = '10';
                
                if (dropdownList.classList.contains('show')) {
                    positionDropdown();
                }
            });

            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase().trim();
                
                if (searchTerm.length === 0) {
                    dropdownList.classList.remove('show');
                    hiddenInput.value = '';
                    stokInfo.classList.remove('show');
                    return;
                }

                filteredProducts = Object.keys(stokData)
                    .filter(urun => urun.toLowerCase().includes(searchTerm))
                    .sort();

                if (filteredProducts.length > 0) {
                    dropdownList.innerHTML = filteredProducts.map(urun => 
                        `<div class="dropdown-item" onclick="selectProduct('${urun}', '${productId}')">${urun}</div>`
                    ).join('');
                    positionDropdown();
                    dropdownList.classList.add('show');
                } else {
                    dropdownList.innerHTML = '<div class="no-results">🔍 Sonuç bulunamadı</div>';
                    positionDropdown();
                    dropdownList.classList.add('show');
                }
            });

            // Scroll sırasında pozisyonu güncelle
            productList.addEventListener('scroll', function() {
                if (dropdownList.classList.contains('show')) {
                    positionDropdown();
                }
            });

            // Pencere resize olunca pozisyonu güncelle
            window.addEventListener('resize', function() {
                if (dropdownList.classList.contains('show')) {
                    positionDropdown();
                }
            });

            miktarInput.addEventListener('input', function() {
                const urun = hiddenInput.value;
                const miktar = parseInt(this.value);
                
                if (urun && miktar && stokData[urun] !== undefined) {
                    if (miktar > stokData[urun]) {
                        stokInfo.className = 'stok-info show';
                        stokInfo.innerHTML = `<p>⚠️ Yetersiz stok! Stokta sadece ${stokData[urun]} adet var</p>`;
                    } else {
                        stokInfo.classList.remove('show');
                    }
                }
            });
        }

        function selectProduct(urun, productId) {
            const searchInput = document.querySelector(`.urun-search[data-id="${productId}"]`);
            const hiddenInput = document.querySelector(`.urun-hidden[data-id="${productId}"]`);
            const dropdownList = document.getElementById(`dropdown-${productId}`);
            const stokInfo = document.getElementById(`stok-${productId}`);
            
            searchInput.value = urun;
            hiddenInput.value = urun;
            dropdownList.classList.remove('show');
            stokInfo.classList.remove('show');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.urun-search') && !e.target.closest('.dropdown-list')) {
                document.querySelectorAll('.dropdown-list').forEach(dropdown => {
                    dropdown.classList.remove('show');
                });
            }
        });

        addProductBtn.addEventListener('click', addProduct);

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const urunInputs = document.querySelectorAll('.urun-hidden');
            const miktarInputs = document.querySelectorAll('.miktar-input');
            
            const urunler = [];
            let hasError = false;
            
            for (let i = 0; i < urunInputs.length; i++) {
                const urun = urunInputs[i].value;
                const miktar = parseInt(miktarInputs[i].value);
                
                if (!urun || !miktar) {
                    showAlert('❌ Lütfen tüm ürünleri ve miktarları doldurun!', 'error');
                    hasError = true;
                    break;
                }
                
                if (stokData[urun] < miktar) {
                    showAlert(`❌ ${urun} için yetersiz stok! Stokta sadece ${stokData[urun]} adet var`, 'error');
                    hasError = true;
                    break;
                }
                
                urunler.push({
                    urun: urun,
                    miktar: miktar
                });
            }
            
            if (hasError) return;
            
            const siparis = {
                urunler: urunler,
                bolum: bolumInput.value,
                notlar: notlarInput.value,
                siparis_veren: 'Web Formu'
            };
            
            loading.classList.add('show');
            submitBtn.disabled = true;
            alert.classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/siparis`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(siparis)
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.detail || 'Sipariş oluşturulamadı');
                }
                
                showAlert(`✓ ${urunler.length} ürünlü sipariş başarıyla oluşturuldu!`, 'success');
                productList.innerHTML = '';
                productCounter = 0;
                form.reset();
                await loadStok();
                
            } catch (error) {
                showAlert(`❌ Hata: ${error.message}`, 'error');
            } finally {
                loading.classList.remove('show');
                submitBtn.disabled = false;
            }
        });

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert ${type} show`;
            setTimeout(() => alert.classList.remove('show'), 15000);
        }

        loadStok();
    </script>
</body>
</html>
